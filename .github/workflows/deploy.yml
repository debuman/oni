name: CI and deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Avoid the top of the hour, when GitHub's scheduler is busiest.
    - cron: '2-59/5 * * * *'
  repository_dispatch:
    types: [github-sync]

permissions: {}

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    name: Check for GitHub changes
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Check out source
        if: github.event_name == 'schedule' || github.event_name == 'repository_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare public GitHub data with the deployed snapshot
        id: check
        if: github.event_name == 'schedule' || github.event_name == 'repository_dispatch'
        run: python3 scripts/sync_state.py
        env:
          GITHUB_TOKEN: ${{ github.token }}

  build:
    name: Test and build
    needs: changes
    if: >-
      (github.event_name != 'schedule' && github.event_name != 'repository_dispatch') ||
      needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    env:
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential libmd4c-dev libmd4c-html0-dev libcurl4-openssl-dev libssl-dev zlib1g-dev util-linux
          rustup toolchain install 1.99.1 --profile minimal --no-self-update
          rustup default 1.99.1

      - name: Restore patched Git
        id: git-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/secure-git/installed
          key: git-ubuntu-26.04-${{ hashFiles('scripts/bootstrap_git.py') }}

      - name: Build patched Git
        if: steps.git-cache.outputs.cache-hit != 'true'
        run: python scripts/bootstrap_git.py

      - name: Select patched Git
        run: |
          echo "$GITHUB_WORKSPACE/.cache/secure-git/installed/bin" >> "$GITHUB_PATH"
          .cache/secure-git/installed/bin/git --version

      - name: Restore Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            .cache/cargo
          key: cargo-ubuntu-26.04-rust-1.99.1-${{ hashFiles('generator/Cargo.lock') }}

      - name: Fetch locked dependencies
        run: cargo fetch --locked --manifest-path generator/Cargo.toml

      - name: Test Rust and build generator
        run: |
          cargo test --offline --locked --manifest-path generator/Cargo.toml --target-dir .cache/cargo
          cargo build --release --offline --locked --manifest-path generator/Cargo.toml --target-dir .cache/cargo

      - name: Run regression and security tests
        run: |
          python -m compileall -q scripts
          python scripts/test_generator.py
          python scripts/test_security.py
          python scripts/test_package_site.py
          python scripts/test_sync.py

      - name: Build public repository browser
        run: python scripts/build.py --base-url https://oni.sqzer.com
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Verify generated site
        run: python scripts/audit_site.py

      - name: Package site including dot-prefixed repositories
        run: python scripts/package_site.py --output "$RUNNER_TEMP/artifact.tar"

      - name: Upload verified Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
